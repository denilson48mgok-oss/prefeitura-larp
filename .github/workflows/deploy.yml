name: Deploy do Portal Prefeitura LARP para GitHub Pages

on:
  # Dispara o deploy automaticamente sempre que houver commit na branch main
  push:
    branches: [main]

  # Permite disparar o deploy manualmente pela aba Actions do GitHub
  workflow_dispatch:

# Permissões necessárias para publicar artefatos no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy concorrente por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🏗️ Compilar portal estático (Astro SSG + Pagefind)
        run: npm run build

      - name: 📤 Enviar artefatos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 🚀 Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
